type User @table {
  displayName: String!
  email: String
  photoUrl: String
  createdAt: Timestamp!
}

type Trip @table {
  user: User!
  name: String!
  destination: String!
  startDate: Date!
  endDate: Date!
  description: String
  isPublic: Boolean
  createdAt: Timestamp!
  updatedAt: Timestamp!
}

type Day @table {
  trip: Trip!
  date: Date!
  dayNumber: Int!
  notes: String
  createdAt: Timestamp!
}

type Activity @table {
  day: Day!
  name: String!
  startTime: Timestamp!
  endTime: Timestamp!
  description: String
  location: String
  url: String
  notes: String
  createdAt: Timestamp!
}

type PointOfInterest @table {
  name: String!
  category: String!
  address: String!
  description: String
  website: String
  phoneNumber: String
  imageUrl: String
  rating: Float
  createdAt: Timestamp!
}